name: publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/wetwarehq/glp1_clinic:latest
            ghcr.io/wetwarehq/glp1_clinic:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/wetwarehq/glp1_clinic
            org.opencontainers.image.title=glp1_clinic
            org.opencontainers.image.description=OSCE GLP-1 AE monitoring clinic
      - name: verify image
        run: |
          docker pull ghcr.io/wetwarehq/glp1_clinic:latest
          docker run --rm ghcr.io/wetwarehq/glp1_clinic:latest --list
